# V0-GAT-04: stamp a gate run with its queue-entry time, for the scorecard's gate p50/p90.
# Use it in a merge_group job before the result sink, pinned by commit:
#
#   permissions: { contents: read, pull-requests: read }   # on the job
#   - uses: quirq-ai/gate/timing@<commit>
#     if: github.event_name == 'merge_group'
#   - uses: quirq-ai/test-pipelines/sink@<commit>
#
# It exports QQ_QUEUED_AT (RFC 3339 UTC), which the sink records as Run.queued_at; only an exact
# time from the PR timeline is exported. Use it only in the gate job that finishes last. It never
# fails the job: a gate run without a queue time is still a gate run, just one the scorecard cannot time.
name: qq gate timing
description: Export QQ_QUEUED_AT, when this merge-queue run's change entered the queue.
inputs:
  token:
    description: "Token to read the PR timeline (needs pull-requests: read)."
    required: false
    default: ${{ github.token }}
outputs:
  queued-at:
    description: The queue-entry time, RFC 3339 UTC, or empty if unknown.
    value: ${{ steps.t.outputs.queued-at }}
runs:
  using: composite
  steps:
    - id: t
      shell: bash
      env:
        QQ_GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -uo pipefail
        # Nothing is installed: queued-at needs only the standard library (Python 3.11+), so no
        # package is resolved or downloaded on a merge-queue run. -I keeps the checked-out repo (the
        # working directory), PYTHONPATH and user site-packages off the import path.
        if at=$(python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from qqgate.cli import main; sys.exit(main(["queued-at"]))' \
            "$GITHUB_ACTION_PATH/../src"); then
          echo "queued-at=$at" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::qq gate timing: no queue-entry time for this run; the scorecard will not time it"
        fi

# V0-ORG-03: merge queue and rulesets as code. suraj applies them (admin); `qqgate settings apply`.
# Product repos' required checks are computed from infra-config (V0-GAT-01) and are not listed here.
# Infra repos are not in pipelines.toml yet, so their hand-written required checks are listed below.
# TODO(expert): move infra repos' builders into infra-config pipelines.toml and compute them too.
# `qqgate settings verify` (CI) fails if a listed check is not a job that runs on pull_request and
# merge_group in that repo's default branch, so a typo can never block every PR.

[org]
owner = "quirq-ai"

[main]
# One ruleset on the default branch of every repo below.
ruleset = "qq-main"
merge_method = "squash"                  # gate.toml [merge_queue]; TODO(suraj): confirm squash for every repo
required_approvals = 0                   # code-owner review on the verification surface is V0-GAT-03
# Nobody bypasses the gate: no agent, and no admin. TODO(suraj): add an admin bypass only if you want a
# break-glass path; it would be a policy change.
bypass = []

[release_refs]
# lkgr and channels/* are written only by the release executor (V0-REL-01, V0-REL-02).
ruleset = "qq-release-refs"
branches = ["lkgr", "channels/**"]
tags = ["lkgr", "channels/**"]
# TODO(suraj): the release executor's identity (a GitHub App id, ideally the agent bot from the
# open identity question). Until it exists nobody can create, move or delete these refs.
bypass_integration_ids = []

# Organization rulesets: "Require workflows to pass before merging". Each runs a workflow from
# another repo's main, so a PR cannot satisfy it with its own same-named job (audit S6: a required
# status check matches on name and app only). They need `--org` and an admin:org token, and they are
# applied only to target repos that are ready in the same run, so they never wedge a repo.
# TODO(suraj): confirm the org's plan offers required workflows in rulesets.

[[org_workflows]]
# infra-config's qq-drift.yml in every product repo, so a PR cannot hand-edit, rename or delete a
# generated qq-*.yml stub (V0-CFG-02). targets = "product": infra-config repos.toml's product repos.
ruleset = "qq-drift"
# Off until infra-config's qq-drift.yml filters to the default branch and compares against a pinned
# config instead of moving main (infra-config audit S3, S4); enforcing it before then would turn
# open product PRs red. Turning it on is a change to this line, reviewed like any policy change.
enabled = false
repository = "infra-config"
path = ".github/workflows/qq-drift.yml"
ref = "refs/heads/main"
targets = "product"

[[org_workflows]]
# toolchains' promotion gate, always from main, so a PR cannot weaken or impersonate the gate that
# decides what promoted.toml may say (toolchains audit; its gate.py handles this pull_request run).
ruleset = "qq-toolchains-promotion-gate"
enabled = true
repository = "toolchains"
path = ".github/workflows/promotion-gate.yml"
ref = "refs/heads/main"
targets = ["toolchains"]

# --- product repos (required checks from infra-config) ---------------------------------------

[[repo]]
name = "xo-space"
kind = "product"
# tests.yml's `tests` job stays required until xo-space's manifest targets cover route parity,
# the install harnesses, plugin sync and the Space UI syntax check (pipelines.toml). V0-ONB-01 drops it.
transitional_checks = ["tests"]

[[repo]]
name = "innernet"
kind = "product"
transitional_checks = []

# --- infra repos (hand-written presubmits, read from each repo's workflows on 2026-10-04) --------

[[repo]]
name = "infra-config"
kind = "infra"
checks = ["validate"]                # qq-drift skips itself here; it is the org workflow below

[[repo]]
name = "depot"
kind = "infra"
# `parity` is a matrix; parity-compare aggregates it but needs `if: always()` and a check that every
# leg succeeded, or a failed leg skips it and GitHub counts the skip as a pass. Asked of depot.
checks = ["test", "parity-compare"]

[[repo]]
name = "sync"
kind = "infra"
checks = ["test"]

[[repo]]
name = "recipes"
kind = "infra"
checks = ["presubmit"]

[[repo]]
name = "test-pipelines"
kind = "infra"
checks = ["presubmit"]

[[repo]]
name = "gate"
kind = "infra"
checks = ["presubmit"]

[[repo]]
name = "toolchains"
kind = "infra"
checks = ["ci"]                      # aggregates unit and promotions
# promotion-gate is enforced by the qq-toolchains-promotion-gate org ruleset above, not listed here:
# it runs on pull_request_target, and a same-named job in a PR could satisfy a status check.
code_owner_review = true             # CODEOWNERS: .github/, tools/, toolchains/, promoted.toml
# One PR per merge group: the queue runs the merge result's promotion-gate.yml, so a group holding a
# gate change and a promotion would judge the promotion by the changed gate.
queue_group_size = 1

[[repo]]
name = "remote-build"
kind = "infra"
checks = ["presubmit", "cross-backend"]
# cross-backend skips on fork PRs, which have no token to dispatch the GitHub backend; the merge
# queue (same repo) always runs it, so the skip cannot land a red change.
allow_conditional = ["cross-backend"]

[[repo]]
name = "perf"
kind = "infra"
# `measure` (build size and benchmarks end to end) is a matrix job, so it cannot be required as is;
# it becomes required once perf adds an `if: always()` aggregator over it.
checks = ["presubmit"]

[[repo]]
name = "gardener"
kind = "infra"
checks = ["presubmit"]

[[repo]]
name = "rollers"
kind = "infra"
checks = ["test"]

[[repo]]
name = "release"
kind = "infra"
checks = ["presubmit"]

# No commits and no presubmit yet. `verify` refuses a repo with no required check (its queue would
# land anything) or no commits (qq-main would refuse the push that creates main), so apply skips it.
[[repo]]
name = "installer"
kind = "infra"
checks = []

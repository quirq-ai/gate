# V0-ORG-03: merge queue and rulesets as code. suraj applies them (admin); `qqgate settings apply`.
# Product repos' required checks are computed from infra-config (V0-GAT-01) and are not listed here.
# Infra repos are not in pipelines.toml yet, so their hand-written required checks are listed below.
# TODO(expert): move infra repos' builders into infra-config pipelines.toml and compute them too.
# `qqgate settings verify` (CI) fails if a listed check is not a job that runs on pull_request and
# merge_group in that repo's default branch, so a typo can never block every PR.

[org]
owner = "quirq-ai"

[main]
# One ruleset on the default branch of every repo below.
ruleset = "qq-main"
merge_method = "squash"                  # gate.toml [merge_queue]; suraj confirmed squash for every repo (2026-10-04)
required_approvals = 0                   # code-owner review on the verification surface is V0-GAT-03
# Nobody bypasses the gate: no agent, and no admin. TODO(suraj): add an admin bypass only if you want a
# break-glass path; it would be a policy change.
bypass = []

[release_refs]
# lkgr and channels/* are written only by the release executor (V0-REL-01, V0-REL-02).
ruleset = "qq-release-refs"
branches = ["lkgr", "channels/**/*"]   # `**/*`: GitHub's `**` alone matches one level only
tags = ["lkgr", "channels/**/*"]
# The release executor is a dedicated GitHub App, quirq-release-executor, not an agent bot: an agent
# identity holding this bypass could write release-state directly. Its App ID (the number on the App's
# General page, not the client id and not an installation id) goes here once it exists. Until then
# nobody can create, move or delete these refs.
bypass_integration_ids = []            # TODO(suraj): [<App ID>] from the App's General page
# The bypass lands only in these repos' qq-release-refs-* (and qq-release-tags), the repos the App is
# installed on: GitHub may refuse an Integration bypass for an App not installed on a repo, and the
# dry run (GET only) could not show that before the write. Every other repo keeps no bypass, depot's
# qq-release-tags included: letting the executor write depot tags means installing the App on depot
# and adding depot here, an explicit later change.
executor_repos = ["release", "innernet", "xo-space"]

[reserved_tags]
# Tags named like a branch. A tag called `main` satisfies a workflow's `github.ref_name == 'main'`
# test, so in every repo nobody may create, move or delete one (perf audit). Every repo's
# state_branches are reserved too: a tag wins over a branch of its name on a short-name fetch.
ruleset = "qq-reserved-tags"
names = ["main"]

[dependabot]
# Product repos with dependabot_branches = true: only Dependabot may update or force-push its own PR
# branches, so the commit rollers checked is the commit that lands (rollers land_check reads
# `update` and `non_fast_forward` on the PR branch). actor_id is GitHub's Dependabot app.
ruleset = "qq-dependabot-branches"
branches = "refs/heads/dependabot/**/*"   # Dependabot names them dependabot/<ecosystem>/<name>; `**` alone is one level
actor_id = 29110

# Organization rulesets: "Require workflows to pass before merging". Each runs a workflow from
# another repo's main, so a PR cannot satisfy it with its own same-named job (audit S6: a required
# status check matches on name and app only). They need `--org` and an admin:org token, and they are
# applied only to target repos that are ready in the same run, so they never wedge a repo.
# TODO(suraj): confirm the org's plan offers required workflows in rulesets.

[[org_workflows]]
# infra-config's qq-drift.yml in every product repo, so a PR cannot hand-edit, rename or delete a
# generated qq-*.yml stub (V0-CFG-02). targets = "product": infra-config repos.toml's product repos.
ruleset = "qq-drift"
# Off until infra-config's qq-drift.yml filters to the default branch and compares against a pinned
# config instead of moving main (infra-config audit S3, S4); enforcing it before then would turn
# open product PRs red. Turning it on is a change to this line, reviewed like any policy change.
enabled = false
repository = "infra-config"
path = ".github/workflows/qq-drift.yml"
ref = "refs/heads/main"
targets = "product"

[[org_workflows]]
# toolchains' promotion gate, always from main, so a PR cannot weaken or impersonate the gate that
# decides what promoted.toml may say (toolchains audit; its gate.py handles this pull_request run).
ruleset = "qq-toolchains-promotion-gate"
# toolchains eb71c8e (#13): no cancel-in-progress (#12) and timeout-minutes 35, within gate.toml's 40.
# Off: quirq-ai is on GitHub Free, which has no org rulesets, and suraj chose no org-wide rules
# (2026-10-04). Turning it on needs a paid plan and is a policy change.
enabled = false
repository = "toolchains"
path = ".github/workflows/promotion-gate.yml"
ref = "refs/heads/main"
# The file GitHub runs, pinned (gate re-check D-2). Its tools still come from toolchains main
# (gate.py), which code-owner review covers (toolchains CODEOWNERS names suraj for tools/, #14).
# Moving it is a reviewed gate PR.
sha = "eb71c8e54eae5ea4a2d27096f1f197dfe91bd8f2"   # toolchains main at #13 (no concurrency, 35 min)
targets = ["toolchains"]

[[org_workflows]]
# Each product repo's presubmit, run from infra-config at a pinned commit, so a PR (or a dependency
# roll) cannot change the workflow that judges it. rollers' land check counts only a workflows rule
# whose entries carry a 40-hex `sha` (rollers R-2). One ruleset per repo: the file names its repo.
# apply --org checks the pinned file: on pull_request and merge_group, no path filter, no job that can
# skip (the only job `if:` allowed is `github.repository == 'quirq-ai/<repo>'`) and no job or step
# with continue-on-error. What the steps run is reviewed in infra-config at the pinned commit.
# infra-config #19 (eaa2c88) dropped cancel-in-progress (GitHub: a ruleset workflow must not cancel
# in progress).
# A builder change in infra-config reaches these only when `sha` moves here (a reviewed gate PR); a
# renamed builder renames the file, so `path` changes with it.
ruleset = "qq-xo-space-presubmit-pinned"
# Off: quirq-ai is on GitHub Free, which has no org rulesets, and suraj chose no org-wide rules
# (2026-10-04). Turning it on needs a paid plan and is a policy change.
enabled = false
pinned = true                        # one target, named in the file; sha required to enable
repository = "infra-config"
path = ".github/workflows/qq-required-xo-space-presubmit.yml"
ref = "refs/heads/main"
sha = "eaa2c88516fe8a8d9c581a65bebe9f9fbfae67c3"   # infra-config main at #19 (no concurrency)
targets = ["xo-space"]

[[org_workflows]]
ruleset = "qq-innernet-presubmit-pinned"
enabled = false                      # see qq-xo-space-presubmit-pinned
pinned = true
repository = "infra-config"
path = ".github/workflows/qq-required-innernet-presubmit.yml"
ref = "refs/heads/main"
sha = "eaa2c88516fe8a8d9c581a65bebe9f9fbfae67c3"   # infra-config main at #19 (no concurrency)
targets = ["innernet"]

# --- product repos (required checks from infra-config) ---------------------------------------

[[repo]]
name = "xo-space"
allow_auto_merge = false              # suraj (2026-10-04): xo-space PRs land by his own "Merge when ready"
kind = "product"
# tests.yml's `tests` is no longer required: the generated xo-space-presubmit runs everything it ran
# (through pytest; xo-space #214 audit), and V0-ONB-01 deletes tests.yml, which a required `tests`
# would block.
transitional_checks = []
# Deferred (gate re-check D-1): the Dependabot app id below cannot be verified from here, and
# rollers keeps Dependabot rolls from auto-landing until its ROL-R6 clears, which these rules would
# allow. Turning them on is this one line, in a reviewed gate PR.
dependabot_branches = false

[[repo]]
name = "innernet"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "product"
transitional_checks = []
# Deferred (gate re-check D-1): the Dependabot app id below cannot be verified from here, and
# rollers keeps Dependabot rolls from auto-landing until its ROL-R6 clears, which these rules would
# allow. Turning them on is this one line, in a reviewed gate PR.
dependabot_branches = false

# --- infra repos (hand-written presubmits, read from each repo's workflows on 2026-10-04) --------

[[repo]]
name = "infra-config"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["validate"]                # qq-drift skips itself here; it is the org workflow below

[[repo]]
name = "depot"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
# Every tag is trusted by depot's pins: a version-only pin (xo-space and innernet `[qq] version`)
# installs tag v<version>, and a git: digest must be on a branch or tag (src/qqdepot/pin.py). Nobody
# may create, move or delete one, not even an admin or the release executor until depot is in
# [release_refs] executor_repos, so v0.1.0 cannot be cut until then. A git: digest must be on main or a v* tag
# (depot #16), and main is locked by qq-main.
release_tags = ["**/*"]              # every tag, nested ones too (`**` alone is one level)
# `parity` is a matrix; parity-compare aggregates it but needs `if: always()` and a check that every
# leg succeeded, or a failed leg skips it and GitHub counts the skip as a pass. Asked of depot.
checks = ["test", "parity-compare"]

[[repo]]
name = "sync"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["test"]

[[repo]]
name = "recipes"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["presubmit"]

[[repo]]
name = "test-pipelines"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["presubmit"]
# scorecard.yml fetches `results`, commits on top and pushes without force (gate re-check D-6).
state_branches = ["results"]

[[repo]]
name = "gate"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["presubmit"]

[[repo]]
name = "toolchains"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["ci", "promotion-gate"]    # ci aggregates unit; promotion-gate on pull_request and
                                     # merge_group since toolchains #15 (the org ruleset that ran it is
                                     # off: Free plan). A PR's own workflows can fake it only by editing
                                     # .github/ (suraj's code-owner review, below); any Actions run with
                                     # checks: write, e.g. from a pushed branch, could still post it,
                                     # which only a required workflow (paid plan) closes.
code_owner_review = true             # CODEOWNERS (toolchains #14, suraj): .github/, tools/, toolchains/,
                                     # toolchains.toml, promoted.toml
# One PR per merge group, so a gate change lands on main before any promotion is judged: the
# merge_group run of promotion-gate takes its tools from the queue base (promotion-gate.yml), so a
# group never mixes a gate change with a promotion.
queue_group_size = 1

[[repo]]
name = "remote-build"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["presubmit", "cross-backend"]
# cross-backend skips on fork PRs, which have no token to dispatch the GitHub backend; the merge
# queue (same repo) always runs it, so the skip cannot land a red change.
allow_conditional = ["cross-backend"]

[[repo]]
name = "perf"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
# measure-result aggregates the `measure` matrix (build size and benchmarks end to end).
checks = ["presubmit", "measure-result"]
state_branches = ["perf-data"]       # the measurement history; its workflow appends, never rewrites

[[repo]]
name = "gardener"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["presubmit"]
# The revert ledger (deleting it would reset the auto-revert cap) and the published tree status. Its
# workflows push to them; the qq-state-branches ruleset blocks only deletion and force-push.
state_branches = ["ledger", "tree-status"]

[[repo]]
name = "rollers"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["test"]

[[repo]]
name = "release"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["presubmit"]
# channels.json and operation keys; same rules as gardener's. TODO(suraj): once the release executor
# identity exists, restrict updates here to it (like qq-release-refs), not just deletion and force-push.
state_branches = ["release-state"]

[[repo]]
name = "installer"
allow_auto_merge = true               # agents queue PRs with auto-merge; it skips no check or review
kind = "infra"
checks = ["presubmit"]

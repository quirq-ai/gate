# A user org's gate settings, for the one-command setup (quirq-ai/setup). Setup fills in the owner and
# the repos, then runs, with this file as FILE:
#   qqgate settings check --settings FILE
#   qqgate settings plan --settings FILE --config <qq-config checkout>
#       --infra-config <infra-config at qq-config's qq.toml pin>
#   qqgate settings verify|apply  (the same, plus) --config-commit <qq-config commit> --checkouts DIR
# gate refuses any other section or key: a user org gets only the qq-main and qq-reserved-tags
# rulesets (no release refs, Dependabot or org rulesets, no per-repo options), and never quirq-ai's.

[org]
owner = "acme"                     # the org that owns qq-config (its code_host), in lower case

[main]
ruleset = "qq-main"                # fixed name
merge_method = "squash"            # must match qq-config's gate.toml
required_approvals = 0             # as quirq-ai has it, so a solo owner can land
bypass = []                        # nobody overrides the gate

[reserved_tags]
ruleset = "qq-reserved-tags"       # fixed name
names = ["main"]                   # a tag named like a branch passes `github.ref_name == 'main'`

# One entry per product repo setup gates (its required checks come from qq-config's generated
# workflows), and qq-config itself, the one infra repo, with the check its own workflow runs.
[[repo]]
name = "qq-config"
kind = "infra"
checks = ["presubmit"]

[[repo]]
name = "app"
kind = "product"

# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: read the infra-config pin
        id: pin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['infra-config']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      - name: required checks for xo-space and innernet, computed from config and manifests (V0-GAT-01)
        run: |
          for repo in xo-space innernet; do
            qqgate required --config .qq/infra-config --repo "$repo" --manifest "tests/fixtures/$repo.repo.toml"
            qqgate rule --config .qq/infra-config --repo "$repo"
          done
      - name: a red PR is refused in xo-space and innernet (V0-GAT-01 done-when, offline half)
        run: |
          for repo in xo-space innernet; do
            rc=0; qqgate verdict --config .qq/infra-config --repo "$repo" --observed tests/fixtures/red.json --json > "$RUNNER_TEMP/v.json" || rc=$?
            cat "$RUNNER_TEMP/v.json"
            [ "$rc" -eq 1 ] && python -c "import json,sys; sys.exit(json.load(open(sys.argv[1]))['verdict'] != 'refused')" "$RUNNER_TEMP/v.json" \
              || { echo "::error::$repo: a red PR was not refused (exit $rc)"; exit 1; }
          done
      - name: rulesets as code build for every repo (V0-ORG-03)
        run: qqgate settings plan --config .qq/infra-config > /dev/null
      - name: this repo's shipped code is agnostic (V0-GAT-02)
        run: qqgate guard --repo gate --github .
      - name: a planted pytest string in a core repo fails the guard (V0-GAT-02 done-when)
        run: |
          commit=$(python -c "import tomllib; print(tomllib.load(open('pins.toml', 'rb'))['sync']['commit'])")
          git init --quiet .qq/sync && git -C .qq/sync fetch --quiet --depth 1 https://github.com/quirq-ai/sync "$commit"
          git -C .qq/sync checkout --quiet FETCH_HEAD
          qqgate guard --repo sync .qq/sync
          echo 'RUNNER = "pytest"' >> .qq/sync/src/qqsync/__init__.py
          rc=0; qqgate guard --repo sync .qq/sync || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::the planted pytest string was not caught (exit $rc)"; exit 1; }
  # Not a required check: it reads other repos' default branches, which change outside this repo.
  # It goes red when a required check listed in settings/github.toml stops running on pull_request
  # and merge_group in an infra repo, so the settings get fixed before anyone applies them.
  # It also runs the agnosticism guard over every core repo's default branch.
  settings-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: read the infra-config pin
        id: pin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['infra-config']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - run: python -m pip install --quiet -e .
      - name: clone every repo's default branch (public, read-only)
        run: |
          for r in $(python -c "import tomllib; print(' '.join(r['name'] for r in tomllib.load(open('settings/github.toml','rb'))['repo']))"); do
            git clone --quiet --depth 1 "https://github.com/quirq-ai/$r" ".qq/repos/$r"
          done
      - name: core repos are agnostic (V0-GAT-02; each repo makes it required in its own presubmit)
        run: |
          for r in $(python -c "import tomllib; print(' '.join(tomllib.load(open('guard/terms.toml','rb'))['core']))"); do
            [ "$r" = gate ] && continue
            qqgate guard --repo "$r" --github ".qq/repos/$r" || failed="$failed $r"
          done
          [ -z "$failed" ] || { echo "::error::not agnostic:$failed"; exit 1; }
      - name: which repos are safe to apply today
        run: |
          infra=$(python -c "import tomllib; print(' '.join('--repo ' + r['name'] for r in tomllib.load(open('settings/github.toml','rb'))['repo'] if r['kind'] == 'infra'))")
          qqgate settings verify --config .qq/infra-config --checkouts .qq/repos || true
          # Drift (a listed check gone or no longer on the queue's events) fails this job; other
          # not-ready reasons are follow-ups owned by that repo and show above.
          qqgate settings verify --config .qq/infra-config --checkouts .qq/repos $infra > "$RUNNER_TEMP/v.txt" || true
          if grep -E "is not a job|does not run on" "$RUNNER_TEMP/v.txt"; then
            echo "::error::settings/github.toml has drifted from an infra repo's workflows"; exit 1
          fi
